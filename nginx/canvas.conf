# /etc/nginx/sites-available/canvas.maqilnaufal.my.id
# Symlink into sites-enabled then: sudo certbot --nginx -d canvas.maqilnaufal.my.id

server {
    listen 80;
    server_name canvas.maqilnaufal.my.id;

    root /home/ubuntu/CanvasAPI;
    index index.html;

    # Allow large uploads (logos, source images for bg-remove)
    client_max_body_size 25M;

    # Static assets — short cache for HTML, long for js/css/json
    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|json|svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # API → Express backend on 127.0.0.1:7878
    location /api/ {
        proxy_pass http://127.0.0.1:7878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # bg-remove can take a few seconds
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
