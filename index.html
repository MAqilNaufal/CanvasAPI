<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Editor</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header>
  <h1>Canvas</h1>

  <div class="project-bar">
    <input id="projectName" type="text" placeholder="Untitled" autocomplete="off">
    <button id="newBtn" title="New project">+ New</button>
    <button id="openBtn" title="Open project">Open ▾</button>
    <button id="saveBtn" title="Save (Cmd/Ctrl+S)">Save</button>
    <span id="saveStatus" class="status"></span>
  </div>

  <div class="size-inputs">
    <input id="cw" type="number" value="1080" min="100" max="8192">
    <span>×</span>
    <input id="ch" type="number" value="1080" min="100" max="8192">
    <button id="resizeBtn">Apply</button>
    <select id="presetSize" title="Size preset">
      <option value="">Preset…</option>
      <option value="1080x1080">IG Post 1:1</option>
      <option value="1080x1350">IG Portrait 4:5</option>
      <option value="1080x1920">Story 9:16</option>
      <option value="1200x630">OG / FB 1.91:1</option>
      <option value="1600x900">YouTube Thumb</option>
      <option value="2480x3508">A4 300dpi</option>
      <option value="3508x2480">A4 Landscape</option>
    </select>
  </div>

  <div class="toolbar">
    <label class="btn">+ Image<input type="file" id="imgInput" accept="image/*" multiple hidden></label>
    <button id="addText">+ Text</button>
    <button id="addRect">+ Rect</button>
    <button id="addCircle">+ Circle</button>
    <button id="addLine">+ Line</button>
    <button id="del" title="Delete (Del)">🗑</button>
    <button id="up" title="Bring forward">↑</button>
    <button id="down" title="Send back">↓</button>
    <button id="undo" title="Undo (Cmd/Ctrl+Z)">⤺</button>
    <button id="redo" title="Redo (Cmd/Ctrl+Shift+Z)">⤻</button>
    <button id="templatesBtn">Templates ▾</button>
    <button id="brandBtn">Brand ▾</button>
    <button id="bulkBtn">Bulk ▾</button>
    <button id="exportBtn">Export ▾</button>
  </div>

  <div id="brand-menu" class="menu wide drawer"></div>
  <div id="templates-menu" class="menu wide drawer tpl-drawer"></div>
  <div id="bulk-menu" class="menu wide drawer bulk-drawer"></div>
  <input type="file" id="csvInput" accept=".csv,text/csv" hidden>
  <input type="file" id="logoInput" accept="image/*" hidden>

  <div id="export-menu" class="menu">
    <button data-export="png">Export PNG</button>
    <button data-export="webp">Export WebP</button>
    <button data-export="svg">Export SVG</button>
    <button data-export="pdf">Export PDF (all pages)</button>
    <button data-export="json">Export JSON</button>
  </div>

  <div id="open-menu" class="menu wide">
    <div class="menu-head">Projects</div>
    <ul id="projectList"></ul>
    <div class="menu-foot">
      <label class="btn small">Import JSON<input type="file" id="importInput" accept="application/json" hidden></label>
    </div>
  </div>
</header>

<aside id="propsPanel" class="props">
  <div class="empty">Select an object</div>
</aside>

<main>
  <div class="canvas-wrap">
    <canvas id="c" width="1080" height="1080"></canvas>
  </div>
</main>

<footer id="pagesBar"></footer>

<script src="js/history.js"></script>
<script src="js/persist.js"></script>
<script src="js/export.js"></script>
<script src="js/props.js"></script>
<script src="js/brand.js"></script>
<script src="js/brandUI.js"></script>
<script src="js/templates.js"></script>
<script src="js/templatesUI.js"></script>
<script src="js/editor.js"></script>
<script src="js/pages.js"></script>
<script src="js/pagesUI.js"></script>
<script src="js/pdf.js"></script>
<script src="js/bulk.js"></script>
<script src="js/bulkUI.js"></script>
<script src="js/app.js"></script>
</body>
</html>
