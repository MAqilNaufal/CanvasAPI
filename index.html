<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CMS Image Compressor (Canvas)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 960px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
    label { display:flex; flex-direction:column; gap:6px; font-size:14px; }
    input, select, button { padding:10px; font-size:14px; }
    #drop { border:2px dashed #bbb; padding:24px; border-radius:12px; margin:16px 0; }
    #log { white-space:pre-wrap; background:#f6f6f6; padding:12px; border-radius:12px; }
    .small { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <h1>CMS Image Compressor (Canvas)</h1>
  <p class="small">Runs locally in your browser. No uploads.</p>

  <div class="row">
    <label>Output format
      <select id="format">
        <option value="image/webp">WebP (smallest)</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/png">PNG (usually larger)</option>
      </select>
    </label>

    <label>Max width (px)
      <input id="maxW" type="number" value="1920" min="1"/>
    </label>

    <label>Max height (px)
      <input id="maxH" type="number" value="1080" min="1"/>
    </label>

    <label>Target max size (MB)
      <input id="targetMB" type="number" value="2" step="0.1" min="0.1"/>
    </label>

    <label>Start quality (0–1)
      <input id="qStart" type="number" value="0.82" step="0.01" min="0.05" max="1"/>
    </label>

    <button id="pick">Pick files</button>
    <input id="file" type="file" accept="image/*" multiple hidden/>
  </div>

  <div id="drop">Drop images here (or click “Pick files”)</div>

  <div class="row">
    <button id="process">Process & Download</button>
    <button id="clear">Clear</button>
  </div>

  <h3>Log</h3>
  <div id="log">No files yet.</div>

<script>
const $ = (id) => document.getElementById(id);

let files = [];

$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => addFiles([...e.target.files]);

$("drop").addEventListener("dragover", (e) => { e.preventDefault(); $("drop").style.borderColor="#444"; });
$("drop").addEventListener("dragleave", () => { $("drop").style.borderColor="#bbb"; });
$("drop").addEventListener("drop", (e) => {
  e.preventDefault(); $("drop").style.borderColor="#bbb";
  addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith("image/")));
});

$("clear").onclick = () => { files = []; log("Cleared."); };

$("process").onclick = async () => {
  if (!files.length) return log("No images to process.");

  const format = $("format").value;
  const maxW = parseInt($("maxW").value, 10);
  const maxH = parseInt($("maxH").value, 10);
  const targetBytes = Math.floor(parseFloat($("targetMB").value) * 1024 * 1024);
  const qStart = Math.min(1, Math.max(0.05, parseFloat($("qStart").value)));

  log(`Processing ${files.length} image(s)...`);
  for (const f of files) {
    try {
      const out = await compressImageToTarget(f, { format, maxW, maxH, targetBytes, qStart });
      const ext = format.includes("webp") ? "webp" : format.includes("jpeg") ? "jpg" : "png";
      const base = f.name.replace(/\.[^.]+$/, "");
      const outName = `${base}_cms.${ext}`;
      downloadBlob(out.blob, outName);

      log(`✅ ${f.name} → ${outName} | ${Math.round(f.size/1024)}KB → ${Math.round(out.blob.size/1024)}KB | q=${out.quality.toFixed(2)} | ${out.width}x${out.height}`);
    } catch (err) {
      log(`❌ ${f.name} failed: ${err.message || err}`);
    }
  }
  log("Done.");
};

function log(msg){
  $("log").textContent = ( $("log").textContent === "No files yet." ? "" : $("log").textContent + "\n") + msg;
}

function addFiles(newOnes){
  files.push(...newOnes);
  log(`Added ${newOnes.length} file(s). Total: ${files.length}`);
}

function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}

async function compressImageToTarget(file, { format, maxW, maxH, targetBytes, qStart }){
  const img = await fileToImage(file);

  // Resize to fit within maxW x maxH (keep aspect)
  const scale = Math.min(1, maxW / img.width, maxH / img.height);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { alpha: true });
  ctx.drawImage(img, 0, 0, w, h);

  // Binary-search quality to reach <= targetBytes (for jpeg/webp)
  if (format === "image/png") {
    // PNG ignores quality; just return resized (may be larger)
    const blob = await canvasToBlob(canvas, format, 1);
    if (blob.size > targetBytes) throw new Error("PNG too large. Use WebP/JPEG.");
    return { blob, quality: 1, width: w, height: h };
  }

  let lo = 0.05, hi = qStart, best = null;

  // First try qStart
  let blob = await canvasToBlob(canvas, format, qStart);
  if (blob.size <= targetBytes) {
    best = { blob, quality: qStart, width: w, height: h };
    // Try higher quality up to 0.95 while staying under target (optional)
    let q = Math.min(0.95, qStart + 0.1);
    while (q <= 0.95) {
      const b = await canvasToBlob(canvas, format, q);
      if (b.size <= targetBytes) { best = { blob: b, quality: q, width: w, height: h }; q += 0.05; }
      else break;
    }
    return best;
  }

  // Otherwise search lower quality
  hi = qStart;
  for (let i=0; i<10; i++){
    const mid = (lo + hi) / 2;
    const b = await canvasToBlob(canvas, format, mid);
    if (b.size <= targetBytes){
      best = { blob: b, quality: mid, width: w, height: h };
      lo = mid; // can try higher
    } else {
      hi = mid; // need lower
    }
  }
  if (!best) throw new Error("Could not reach target size. Reduce max dimensions.");
  return best;
}

function canvasToBlob(canvas, type, quality){
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("toBlob failed")), type, quality);
  });
}

function fileToImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image load error")); };
    img.src = url;
  });
}
</script>
</body>
</html>
